<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login failed</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><div class="error-page">
  <h1>Login failed</h1>
  <p>Discord didn't complete the sign-in ({{ reason }}). This usually means the redirect URI in your Discord app doesn't exactly match DISCORD_REDIRECT_URI, or the login link expired.</p>
  <a class="btn btn-gold" href="/login">Try again</a>
</div></body></html>
